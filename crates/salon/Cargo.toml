[package]
name = "salon"
description = "Live co-editing rooms for Facile Suite apps: one Yjs document per open room over y-websocket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["ws", "tokio"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1.44"
uuid = "1.29.2"
yrs = { version = "0.28.1", features = ["sync"] }

[dev-dependencies]
axum = { version = "0.8.9", default-features = false, features = ["ws", "tokio", "http1"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-tungstenite = "0.29.0"
uuid = { version = "1.29.2", features = ["v4"] }
